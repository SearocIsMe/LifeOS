[alembic]
script_location = alembic
# K8s cluster Service DNS (ADR-0004). DATABASE_URL env var overrides this (alembic/env.py);
# the password is injected at runtime from K8s Secret lifeos-postgres - never commit it.
sqlalchemy.url = postgresql+psycopg://lifeos:CHANGE_ME@postgres.lifeos-dev.svc.cluster.local:5432/lifeos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
