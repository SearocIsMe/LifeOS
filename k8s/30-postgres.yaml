# PostgreSQL 16 + pgvector - the single authoritative source (architecture §1).
# Pinned to node aisi-w7 (database node per ADR-0004); storage huawei-sc RWX.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lifeos-postgres
  namespace: lifeos-dev
spec:
  serviceName: lifeos-postgres-headless
  replicas: 1
  selector:
    matchLabels: { app: lifeos-postgres }
  template:
    metadata:
      labels: { app: lifeos-postgres }
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # aisi-w7 carries taint mpc-cpt-role=infra:NoSchedule (tenant isolation).
      # We tolerate it HERE ONLY - no taint was removed from the shared node,
      # other tenants' scheduling behavior is unchanged.
      tolerations:
        - key: mpc-cpt-role
          operator: Equal
          value: infra
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [aisi-w7]
      containers:
        - name: postgres
          image: 172.128.0.11:30500/dtc/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5432, name: pg }]
          envFrom:
            - secretRef: { name: lifeos-postgres }
          # PGDATA must live in a SUBDIRECTORY: the huawei-sc volume root
          # exposes a read-only `.snapshot` dir (NAS) which breaks the
          # postgres entrypoint's chown pass over $PGDATA.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 16Gi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lifeos", "-d", "lifeos"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteMany]
        storageClassName: huawei-sc
        resources: { requests: { storage: 100Gi } }
---
# headless: stable DNS for the StatefulSet (lifeos-postgres-0.lifeos-postgres-headless...)
apiVersion: v1
kind: Service
metadata:
  name: lifeos-postgres-headless
  namespace: lifeos-dev
spec:
  clusterIP: None
  selector: { app: lifeos-postgres }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
# client entrypoint: postgres.lifeos-dev.svc.cluster.local:5432
# NOTE: no NodePort for postgres - cluster-internal only (HANDOVER §7.1).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lifeos-dev
spec:
  selector: { app: lifeos-postgres }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
